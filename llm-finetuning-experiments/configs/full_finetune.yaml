run_name: full-codealpaca
model_name: meta-llama/Llama-3.2-3B
dataset: codealpaca        # same data as the QLoRA run so the comparison is clean
max_samples: 20000
output_dir: outputs/full-codealpaca
method: full

training:
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5    # much lower than QLoRA, full fine-tuning is touchier
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_seq_length: 1024
  logging_steps: 10
  save_steps: 200
  bf16: true
  gradient_checkpointing: true
  optim: adamw_torch
  seed: 42
  report_to: wandb
