run_name: qlora-ossinstruct
model_name: meta-llama/Llama-3.2-3B
dataset: ossinstruct        # codealpaca | ossinstruct
max_samples: 20000
output_dir: outputs/qlora-ossinstruct
method: qlora              # qlora | full

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_seq_length: 1024
  logging_steps: 10
  save_steps: 200
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  seed: 42
  report_to: wandb
